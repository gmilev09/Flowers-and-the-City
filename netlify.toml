[build]
  command = "npm run build"
  publish = "dist"

# Липсващите снимки връщат истински 404 (малък файл), а не цялата
# начална страница. Така браузърът получава грешка веднага и
# React подменя адреса с резервен кадър (вж. src/lib/fallbacks.js).
# Съществуващите файлове се обслужват нормално, защото правилото не е force.
[[redirects]]
  from = "/images/*"
  to = "/404.html"
  status = 404

# SPA fallback — всички пътища водят към началната страница
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
